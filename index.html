<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>云之帝国</title>
<meta name="theme-color" content="#050505">

<script>document.documentElement.classList.add('boot-pending');setTimeout(function(){document.documentElement.classList.remove('boot-pending')},3500)</script>
<link rel="stylesheet" href="style.css?v=23" onload="document.documentElement.classList.remove('boot-pending')" onerror="document.documentElement.classList.remove('boot-pending')">
<!-- SLAM binary distributed separately by 8th Wall, subject to its own license. -->
<script defer src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
<!-- Official 8th Wall full-window canvas support, including orientation changes. -->
<script defer src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" crossorigin="anonymous" data-preload-chunks="slam"></script>
<!-- Use classic GLTFLoader with the SAME global Three.js as 8th Wall. -->

<body>
<canvas id="camerafeed"></canvas>

<header><div class="projectIdentity"><strong>云之帝国</strong><span class="artistName">梅特·库图鲁</span></div><button id="reset" hidden type="button">重新开始</button></header>
<main id="gate"><div class="gateContent"><div class="mark"><span>⟐</span><span>Ⳉ</span><span>※</span></div><p class="gateIntro">一个由代码构成的世界，正等待着你。</p><button id="start">进入矩阵</button></div></main>
<div id="hud" hidden><div class="status" id="tracking">INITIALIZING TRACKING</div><p id="instruction">Move your phone slowly left and right to map the room.</p><button id="place" disabled hidden>重新开始</button><button id="oracleTrigger" hidden>触碰矩阵</button><div id="detail">Walk and turn inside the static glyph chamber. Symbols stay fixed in space.</div></div>
<section id="portalPrompt" role="dialog" aria-modal="false" aria-labelledby="portalTitle" hidden>
  <div class="portalMark">⟐</div>
  <h2 id="portalTitle">你准备好进入矩阵了吗？</h2><p id="portalNote"></p>
  <div class="portalChoices">
    <button type="button" id="portalYes">是</button>
    <button type="button" id="portalNo">否</button>
  </div>
</section>
<section id="bookPanel" hidden><div id="bookCount">第一卷</div><div id="bookTitle">东方之风</div><div id="bookHint">轻触书籍以打开</div><button id="bookAction" type="button">轻触书籍以打开</button></section><section id="finalPanel" hidden role="dialog" aria-labelledby="finalText"><div class="portalMark">⟐</div><h2 id="finalText"><span>想要发现隐藏的真相吗？</span><span>只剩最后一步。</span></h2><button id="finalEnter" type="button">进入</button></section><div id="error" role="alert" hidden></div>
<footer>METE KUTLU · CODES, COLORS AND COSMOS</footer>
</body>
</html>
